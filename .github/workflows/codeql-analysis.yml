name: CODEQL-ANALYSIS

on:
  workflow_call:
    inputs:
      ENV_NAME:
        required: true
        type: string
jobs:
  codeql_analysis:
    runs-on: ${{vars.ACT_GITHUB_RUNNER}}
    environment: ${{ inputs.ENV_NAME }}
    env:
      CODEQL: ${{ vars.CODEQL }}
      ENVY: ${{ inputs.ENV_NAME }}

    steps:
      - name: Checkout Project ${{github.event.repository.name}} , Branch - ${{github.ref_name}}
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        if: ${{ env.CODEQL =='true' &&  env.ENVY == 'dev' }}
        uses: github/codeql-action/init@v3

        with:
          languages: java
          build-mode: none

      - name: Perform CodeQL Analysis
        if: ${{ env.CODEQL =='true' &&  env.ENVY == 'dev' }}
        uses: github/codeql-action/analyze@v3



